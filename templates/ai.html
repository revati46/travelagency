<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trip Suggestor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='ai.css') }}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Include jQuery -->
<script src="{{ url_for('static', filename='ai.js') }}"></script>
</head>
<body>

  <div class="aitripForm">
    <h2>Give us your choices</h2>
    <form method="POST" action="/generate_trip">
      <input type="text" name="location" placeholder="Location" required>
      <input type="text" name="interest" placeholder="Interest" required>
      <input type="number" name="duration" placeholder="Duration (in days)" required>
      <input type="number" name="budget" placeholder="Budget" required>
        <button type="submit">Submit</button>
    </form>
    
</div>

    <div id="generated-text">
      {% if ai_response %}
          {{ ai_response }}
      {% endif %}
  </div>

  
</body>
</html>
